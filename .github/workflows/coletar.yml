name: Coletar dados dos dashs

on:
  schedule:
    - cron: "40 * * * *"   # toda hora, depois que os dashs dos clientes atualizam
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar (somente leitura nos repos dos clientes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python coletar.py
      - name: Publicar status.json
        run: |
          git config user.name "sobe-painel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet && exit 0
          git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -q origin main
          git push
